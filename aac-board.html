<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AAC 沟通板</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f7f4;
    --card-bg: #fff;
    --text: #1a1a1a;
    --muted: #999;
    --accent: #059669;
    --accent-light: #ecfdf5;
    --danger: #ef4444;
    --border: #e8e5e0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 10px rgba(0,0,0,.03);
    --radius: 16px;
  }
  body {
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none; overflow: hidden;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; flex-shrink: 0; gap: 10px;
  }
  .back {
    font-size: 15px; color: var(--muted); text-decoration: none;
    white-space: nowrap; transition: color .2s;
  }
  .back:hover { color: var(--text); }
  .topbar h2 { font-size: 17px; font-weight: 600; white-space: nowrap; }

  /* Search */
  .search-wrap {
    flex: 1; max-width: 300px; position: relative;
  }
  .search-wrap input {
    width: 100%; padding: 8px 14px 8px 34px; border-radius: 100px;
    border: 1px solid var(--border); background: #fff;
    font-size: 14px; outline: none; font-family: inherit;
    transition: border .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: var(--muted); pointer-events: none;
  }
  .add-btn {
    background: var(--accent); color: #fff; border: none;
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    font-size: 20px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:active { transform: scale(.92); }

  /* Categories */
  .tabs {
    display: flex; gap: 6px; padding: 4px 16px 10px;
    overflow-x: auto; flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 7px 16px; border-radius: 100px;
    border: 1px solid var(--border); background: #fff;
    font-size: 13px; cursor: pointer; transition: all .15s;
    font-family: inherit; color: var(--text);
    white-space: nowrap;
  }
  .tab:active { transform: scale(.96); }
  .tab.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* Grid */
  .grid {
    flex: 1; overflow-y: auto; padding: 2px 12px 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px; align-content: start;
    -webkit-overflow-scrolling: touch;
  }
  .card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 14px 4px; gap: 5px;
    cursor: pointer; transition: all .15s;
    min-height: 90px; position: relative;
  }
  .card:active {
    transform: scale(.94); background: var(--accent-light); border-color: var(--accent);
  }
  .card .emoji { font-size: 32px; line-height: 1; transition: transform .15s; }
  .card:active .emoji { transform: scale(1.15); }
  .card .label {
    font-size: 13px; font-weight: 550; text-align: center;
    line-height: 1.25; color: var(--text);
  }
  .card .delete-card {
    position: absolute; top: 4px; right: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; background: #fee2e2; color: var(--danger);
    font-size: 12px; cursor: pointer; display: none;
    align-items: center; justify-content: center; line-height: 1;
  }
  .card.custom:hover .delete-card { display: flex; }
  @media (hover: none) { .card.custom .delete-card { display: none !important; } }

  /* No results */
  .no-results {
    grid-column: 1 / -1; text-align: center;
    padding: 40px 20px; color: #ccc; font-size: 15px;
  }

  /* Sentence bar */
  .sentence-bar {
    flex-shrink: 0; background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex; gap: 8px; align-items: center;
  }
  .sentence-pills { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; min-height: 36px; align-items: center; }
  .sentence-pills .empty { color: #ccc; font-size: 13px; }
  .pill {
    display: flex; align-items: center; gap: 4px;
    background: var(--accent-light); border: 1px solid var(--accent);
    padding: 5px 10px; border-radius: 100px; font-size: 13px;
    animation: popIn .2s ease;
  }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pill .x { cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; margin-left: 1px; }
  .pill .x:active { color: var(--danger); }
  .speak-all-btn {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
    border: none; background: var(--accent); color: #fff;
    font-size: 20px; cursor: pointer; transition: all .15s;
    box-shadow: 0 2px 10px rgba(5,150,105,.25);
  }
  .speak-all-btn:active { transform: scale(.92); }
  .speak-all-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
  .quick-input {
    flex: 1; min-width: 100px; padding: 8px 14px; border-radius: 100px;
    border: 1px solid var(--border); font-size: 14px; outline: none;
    font-family: inherit; background: #f9f9f9;
  }
  .quick-input:focus { border-color: var(--accent); background: #fff; }
  .quick-speak-btn {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: #fff; font-size: 16px;
    cursor: pointer; transition: all .15s;
  }
  .quick-speak-btn:active { background: var(--accent-light); }
  .speak-all-btn.playing { background: var(--danger); animation: pulse 1s ease infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
    50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal-bg.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #fff; border-radius: 20px 20px 0 0;
    padding: 28px 24px 36px; width: 100%; max-width: 480px;
    transform: translateY(100%); transition: transform .3s ease;
  }
  .modal-bg.show .modal { transform: translateY(0); }
  .modal h3 { font-size: 18px; margin-bottom: 20px; }
  .modal input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--border); font-size: 16px;
    margin-bottom: 12px; outline: none; font-family: inherit;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  .modal .btn-row button {
    flex: 1; padding: 14px; border-radius: 12px;
    border: none; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .modal .btn-cancel { background: #f5f5f5; color: var(--text); }
  .modal .btn-save { background: var(--accent); color: #fff; }

  @media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  @media (min-width: 1200px) { .grid { grid-template-columns: repeat(8, 1fr); } }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">&larr; 返回</a>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索卡片..." oninput="doSearch()">
  </div>
  <button class="add-btn" onclick="showAddModal()">+</button>
</div>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="sentence-bar">
  <div class="sentence-pills" id="sentencePills">
    <span class="empty">点击卡片组成句子</span>
  </div>
  <input type="text" class="quick-input" id="quickInput" placeholder="或直接输入自定义文字..." onkeydown="if(event.key==='Enter')speakQuick()">
  <button class="quick-speak-btn" onclick="speakQuick()" title="朗读输入的文字">📢</button>
  <button class="speak-all-btn" id="speakAllBtn" onclick="speakAll()" disabled>🔊</button>
</div>

<div class="modal-bg" id="modalBg" onclick="hideAddModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>添加自定义卡片</h3>
    <input type="text" id="cardEmoji" placeholder="Emoji 图标，如 😊" maxlength="4">
    <input type="text" id="cardLabel" placeholder="卡片文字，如 我很好" maxlength="20">
    <input type="text" id="cardCategory" placeholder="分类名（留空归入'自定义'）" maxlength="8">
    <div class="btn-row">
      <button class="btn-cancel" onclick="hideAddModal()">取消</button>
      <button class="btn-save" onclick="addCustomCard()">保存</button>
    </div>
  </div>
</div>

let customCards = {};
try { customCards = JSON.parse(localStorage.getItem('aac_custom_cards')) || {}; } catch(e) {}

function getCategories() {
  const cats = Object.keys(defaultCards);
  const extras = Object.keys(customCards).filter(c => !cats.includes(c));
  return [...cats, ...extras];
}

let currentCategory = '日常';
let sentence = [];
let searchMode = false;
let searchResults = [];

function renderTabs() {
  if (searchMode) return;
  document.getElementById('tabs').innerHTML = getCategories().map(c =>
    `<button class="tab${c === currentCategory ? ' active' : ''}" onclick="switchCategory('${c}')">${c}</button>`
  ).join('');
}

function switchCategory(cat) {
  searchMode = false;
  currentCategory = cat;
  document.getElementById('searchInput').value = '';
  renderTabs();
  renderGrid();
}

function getCardsFor(cat) {
  const builtin = defaultCards[cat] || [];
  const extras = customCards[cat] || [];
  return [...builtin, ...extras];
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { searchMode = false; renderTabs(); renderGrid(); return; }
  searchMode = true;
  document.getElementById('tabs').innerHTML = '<span style="font-size:13px;color:var(--muted);padding:7px 0;">搜索结果</span>';
  searchResults = [];
  for (const cat of getCategories()) {
    for (const card of getCardsFor(cat)) {
      if (card.label.toLowerCase().includes(q)) searchResults.push(card);
    }
  }
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  let cards;
  if (searchMode) {
    cards = searchResults;
  } else {
    cards = getCardsFor(currentCategory);
  }

  if (!cards.length) {
    grid.innerHTML = '<div class="no-results">没有找到匹配的卡片<br><span style="font-size:12px;">试试其他关键词，或点击 + 添加自定义卡片</span></div>';
    return;
  }

  grid.innerHTML = cards.map((c, i) => {
    const isCustom = !searchMode && customCards[currentCategory] && i >= (defaultCards[currentCategory]||[]).length;
    const cat = searchMode ? '' : currentCategory;
    const idx = searchMode ? -1 : i - (defaultCards[currentCategory]||[]).length;
    return `
      <div class="card${isCustom ? ' custom' : ''}" onclick="tapCard('${c.label.replace(/'/g, "\\'")}')">
        ${isCustom ? `<button class="delete-card" onclick="event.stopPropagation();deleteCard('${cat}',${idx})">×</button>` : ''}
        <span class="emoji">${c.emoji}</span>
        <span class="label">${c.label}</span>
      </div>`;
  }).join('');
}

function tapCard(label) {
  sentence.push(label);
  renderSentence();
  speak(label);
  if (navigator.vibrate) navigator.vibrate(15);
}

function speak(text) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-CN'; utt.rate = 0.85;
  utt.onstart = () => document.getElementById('speakAllBtn').classList.add('playing');
  utt.onend = () => document.getElementById('speakAllBtn').classList.remove('playing');
  speechSynthesis.speak(utt);
}

function speakAll() {
  if (!sentence.length) return;
  speak(sentence.join('，'));
}

function removeFromSentence(idx) { sentence.splice(idx, 1); renderSentence(); }

function renderSentence() {
  const container = document.getElementById('sentencePills');
  const btn = document.getElementById('speakAllBtn');
  if (!sentence.length) {
    container.innerHTML = '<span class="empty">点击卡片组成句子</span>';
    btn.disabled = true;
  } else {
    container.innerHTML = sentence.map((t, i) =>
      `<span class="pill">${t}<span class="x" onclick="removeFromSentence(${i})">×</span></span>`
    ).join('');
    btn.disabled = false;
  }
}

function showAddModal() {
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('cardEmoji').focus();
}

function hideAddModal(e) {
  if (e && e.target !== document.getElementById('modalBg')) return;
  document.getElementById('modalBg').classList.remove('show');
  document.getElementById('cardEmoji').value = '';
  document.getElementById('cardLabel').value = '';
  document.getElementById('cardCategory').value = '';
}

function addCustomCard() {
  const emoji = document.getElementById('cardEmoji').value.trim();
  const label = document.getElementById('cardLabel').value.trim();
  let category = document.getElementById('cardCategory').value.trim();
  if (!emoji || !label) { alert('请填写 Emoji 和文字'); return; }
  if (!category) category = '自定义';
  if (!customCards[category]) customCards[category] = [];
  customCards[category].push({ emoji, label });
  localStorage.setItem('aac_custom_cards', JSON.stringify(customCards));
  hideAddModal();
  currentCategory = category;
  searchMode = false;
  document.getElementById('searchInput').value = '';
  renderTabs();
  renderGrid();
}

function deleteCard(cat, idx) {
  customCards[cat].splice(idx, 1);
  if (!customCards[cat].length) delete customCards[cat];
  localStorage.setItem('aac_custom_cards', JSON.stringify(customCards));
  if (!getCardsFor(currentCategory).length) { currentCategory = '日常'; renderTabs(); }
  renderGrid();
}

renderTabs();
renderGrid();

function speakQuick() {
  const text = document.getElementById('quickInput').value.trim();
  if (!text) return;
  speak(text);
  sentence.push(text);
  renderSentence();
  document.getElementById('quickInput').value = '';
  if (navigator.vibrate) navigator.vibrate(15);
}
