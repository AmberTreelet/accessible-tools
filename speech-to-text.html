<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>语音转文字大字幕</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --text: #ffffff;
    --muted: #888;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,.3);
    --danger: #ef4444;
    --radius: 16px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    flex-shrink: 0;
  }
  .back {
    font-size: 15px; color: var(--muted); text-decoration: none;
    display: flex; align-items: center; gap: 6px;
    transition: color .2s;
  }
  .back:hover { color: var(--text); }
  .topbar .actions { display: flex; gap: 10px; }
  .topbar .actions button {
    background: var(--surface); border: 1px solid #2a2a2a;
    color: var(--muted); font-size: 13px; padding: 7px 14px;
    border-radius: 100px; cursor: pointer;
    transition: all .2s;
  }
  .topbar .actions button:hover { color: var(--text); border-color: #444; }
  .topbar .actions button.active {
    background: #1e3a5f; color: #60a5fa; border-color: #3b82f644;
  }

  /* Main display area */
  .display {
    flex: 1; display: flex; flex-direction: column;
    overflow-y: auto; padding: 20px;
    scroll-behavior: smooth;
  }
  .display::-webkit-scrollbar { width: 4px; }
  .display::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* Transcript bubbles */
  .bubble {
    max-width: 90%;
    padding: 16px 20px; border-radius: 20px;
    margin-bottom: 12px;
    animation: fadeUp .35s ease;
    line-height: 1.5; font-size: 22px;
    font-weight: 450;
    word-break: break-word;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble.interim {
    background: var(--surface);
    color: #aaa;
    font-style: italic;
  }
  .bubble.final {
    background: #1e3a5f;
    color: #e0e7ff;
  }

  /* Idle state */
  .idle-hint {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #333; gap: 12px;
  }
  .idle-hint .pulse-ring {
    width: 80px; height: 80px; border-radius: 50%;
    background: #1a1a1a; border: 2px solid #2a2a2a;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
  .idle-hint p { font-size: 15px; color: #555; }

  /* Bottom controls */
  .controls {
    flex-shrink: 0; padding: 20px 20px 32px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .mic-btn {
    width: 72px; height: 72px; border-radius: 50%;
    border: none; background: var(--accent);
    color: white; font-size: 30px; cursor: pointer;
    transition: all .25s ease;
    box-shadow: 0 0 0 0 var(--accent-glow);
    position: relative;
  }
  .mic-btn:active { transform: scale(.94); }
  .mic-btn.listening {
    background: var(--danger);
    animation: pulse 1.8s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.4); }
    50% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
  }
  .mic-btn.listening::after {
    content: ''; position: absolute;
    inset: -6px; border-radius: 50%;
    border: 2px solid rgba(239,68,68,.3);
    animation: ringPulse 1.8s ease infinite;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: .6; }
    50% { transform: scale(1.25); opacity: 0; }
  }

  .status-text {
    font-size: 13px; color: var(--muted);
    letter-spacing: .02em;
  }
  .status-text.listening { color: var(--danger); }

  .lang-select {
    background: var(--surface); border: 1px solid #2a2a2a;
    color: var(--text); font-size: 14px;
    padding: 8px 16px; border-radius: 100px;
    cursor: pointer; outline: none;
    -webkit-appearance: none;
  }

  /* Fullscreen mode */
  .fullscreen .topbar { opacity: .3; }
  .fullscreen .topbar:hover { opacity: 1; }
  .fullscreen .bubble { font-size: 36px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; font-size: 14px;
    padding: 10px 20px; border-radius: 100px;
    pointer-events: none; opacity: 0;
    transition: opacity .3s;
    z-index: 10;
  }
  .toast.show { opacity: 1; }

  .browser-warn {
    flex-shrink: 0; padding: 10px 16px; background: #332200;
    color: #fbbf24; font-size: 12px; text-align: center; line-height: 1.6;
    border-bottom: 1px solid #553300;
  }
  .type-mode {
    flex-shrink: 0; padding: 10px 20px; display: flex; gap: 8px;
    border-top: 1px solid #2a2a2a; align-items: center;
  }
  .type-mode input {
    flex: 1; padding: 12px 16px; border-radius: 100px;
    border: 1px solid #2a2a2a; background: var(--surface);
    color: var(--text); font-size: 16px; outline: none; font-family: inherit;
  }
  .type-mode input:focus { border-color: var(--accent); }
  .type-mode button {
    flex-shrink: 0; padding: 12px 20px; border-radius: 100px;
    border: none; background: var(--accent); color: #fff;
    font-size: 16px; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <a href="index.html" class="back">&larr; 返回首页</a>
  <div class="actions">
    <button id="darkToggle" class="active" onclick="toggleTheme()">暗色</button>
    <button id="fsToggle" onclick="toggleFullscreen()">全屏</button>
    <button id="saveBtn" onclick="saveTranscript()">保存</button>
    <button id="clearBtn" onclick="clearTranscript()">清空</button>
  </div>
</div>

<div class="browser-warn" id="browserWarn" style="display:none">
  <span>⚠️ 语音识别需要 <b>Chrome 或 Edge 浏览器</b>，且需通过 <b>localhost/HTTPS</b> 访问（直接用 file:// 可能无法使用麦克风）。<br>如果无法使用语音，请用下方<b>打字模式</b>代替。</span>
</div>

<div class="display" id="display">
  <div class="idle-hint" id="idleHint">
    <div class="pulse-ring">🎤</div>
    <p>点击下方按钮开始聆听</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="type-mode" id="typeMode">
  <input type="text" id="typeInput" placeholder="打字模式：输入文字后按回车发送..." onkeydown="if(event.key==='Enter')sendTyped()">
  <button onclick="sendTyped()">发送</button>
</div>

<div class="controls">
  <select class="lang-select" id="langSelect">
    <option value="zh-CN">中文（普通话）</option>
    <option value="yue-Hant-HK">粤语</option>
    <option value="en-US">English</option>
    <option value="ja-JP">日本語</option>
    <option value="ko-KR">한국어</option>
    <option value="fr-FR">Français</option>
    <option value="de-DE">Deutsch</option>
    <option value="es-ES">Español</option>
  </select>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
  <div class="status-text" id="statusText">点击麦克风开始</div>
</div>

<script>
let recognition = null;
let isListening = false;
let transcriptHistory = [];
let darkMode = true;

// Init
function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('您的浏览器不支持语音识别，请使用 Chrome 或 Edge');
    document.getElementById('micBtn').disabled = true;
    return false;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = document.getElementById('langSelect').value;

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    if (final) addBubble(final, 'final');
    if (interim) updateInterim(interim);
    else removeInterim();
    document.getElementById('idleHint').style.display = 'none';
    scrollDown();
  };

  recognition.onerror = (e) => {
    if (e.error === 'no-speech') return;
    if (e.error === 'aborted') return;
    showToast('错误: ' + e.error);
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) {
      try { recognition.start(); } catch(_) { stopListening(); }
    }
  };
  return true;
}

function toggleMic() {
  if (!recognition) { if (!initSpeech()) return; }
  if (isListening) stopListening(); else startListening();
}

function startListening() {
  try { recognition.start(); } catch(e) { }
  isListening = true;
  const btn = document.getElementById('micBtn');
  btn.textContent = '⏹';
  btn.classList.add('listening');
  const st = document.getElementById('statusText');
  st.textContent = '正在聆听...';
  st.classList.add('listening');
  removeInterim();
  document.getElementById('idleHint').style.display = 'none';

  // Vibration on mobile
  if (navigator.vibrate) navigator.vibrate(50);
}

function stopListening() {
  try { recognition.stop(); } catch(e) { }
  isListening = false;
  const btn = document.getElementById('micBtn');
  btn.textContent = '🎤';
  btn.classList.remove('listening');
  const st = document.getElementById('statusText');
  st.textContent = '点击麦克风开始';
  st.classList.remove('listening');
  removeInterim();
}

function addBubble(text, type) {
  const el = document.createElement('div');
  el.className = 'bubble ' + type;
  el.textContent = text;
  document.getElementById('display').appendChild(el);
  if (type === 'final') transcriptHistory.push({ text, time: new Date().toISOString() });
}

function updateInterim(text) {
  let el = document.querySelector('.bubble.interim');
  if (!el) { el = document.createElement('div'); el.className = 'bubble interim'; document.getElementById('display').appendChild(el); }
  el.textContent = text;
}

function removeInterim() {
  const el = document.querySelector('.bubble.interim');
  if (el) el.remove();
}

function scrollDown() {
  const d = document.getElementById('display');
  d.scrollTop = d.scrollHeight;
}

function clearTranscript() {
  document.getElementById('display').innerHTML = '';
  document.getElementById('idleHint').style.display = 'flex';
  transcriptHistory = [];
}

function saveTranscript() {
  if (!transcriptHistory.length) { showToast('暂无对话记录'); return; }
  const text = transcriptHistory.map(t => t.text).join('\n\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'transcript_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click(); URL.revokeObjectURL(url);
  showToast('已下载');
}

function toggleTheme() {
  darkMode = !darkMode;
  const root = document.documentElement;
  const btn = document.getElementById('darkToggle');
  if (darkMode) {
    root.style.setProperty('--bg', '#0f0f0f');
    root.style.setProperty('--surface', '#1a1a1a');
    root.style.setProperty('--text', '#ffffff');
    root.style.setProperty('--muted', '#888');
    btn.textContent = '暗色'; btn.classList.add('active');
  } else {
    root.style.setProperty('--bg', '#ffffff');
    root.style.setProperty('--surface', '#f5f5f5');
    root.style.setProperty('--text', '#1a1a1a');
    root.style.setProperty('--muted', '#666');
    btn.textContent = '亮色'; btn.classList.remove('active');
  }
}

function toggleFullscreen() {
  document.body.classList.toggle('fullscreen');
  const btn = document.getElementById('fsToggle');
  btn.classList.toggle('active');
}

document.getElementById('langSelect').addEventListener('change', function() {
  if (recognition) recognition.lang = this.value;
});

function sendTyped() {
  const input = document.getElementById('typeInput');
  const text = input.value.trim();
  if (!text) return;
  addBubble(text, 'final');
  document.getElementById('idleHint').style.display = 'none';
  transcriptHistory.push({ text, time: new Date().toISOString() });
  scrollDown();
  input.value = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Browser detection
const isChrome = /Chrome/.test(navigator.userAgent) && !/Edg/.test(navigator.userAgent);
const isEdge = /Edg/.test(navigator.userAgent);
const isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (!isSecure) {
  document.getElementById('browserWarn').style.display = '';
  document.getElementById('browserWarn').innerHTML += '<br><small>当前: ' + location.protocol + '// — 建议用 localhost 打开</small>';
}

initSpeech();
</script>
</body>
</html>
